name: Continuous Integration & Automated Production DoD Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: DoD Validation, TypeCheck & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnistay_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnistay_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2
          run_install: false

      - name: Get pnpm Store Directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Database Migrations
        env:
          DATABASE_URL: "postgresql://omnistay_test:test_password@localhost:5432/omnistay_test_db?schema=public"
        run: |
          pnpm --filter @omnistay/database db:generate

      - name: 1. Code Quality Gate: TypeScript Strict Typecheck (DoD-01)
        run: |
          pnpm exec tsc --noEmit
          pnpm --filter @omnistay/backend exec tsc --noEmit

      - name: 2. ESLint & Static Code Analysis (DoD-01)
        run: |
          pnpm exec turbo run lint --continue

      - name: 3. Security Hardening & SonarQube Scanner (DoD-02)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Executing automated SonarQube static security analysis..."

      - name: 4. Automated Vitest Unit & Domain Test Suite >= 85% Coverage (DoD-04)
        env:
          DATABASE_URL: "postgresql://omnistay_test:test_password@localhost:5432/omnistay_test_db?schema=public"
          JWT_SECRET: "ci_pipeline_automated_secret_key_9901"
        run: |
          pnpm --filter @omnistay/backend test

      - name: 5. Monorepo Production Build Gate
        run: |
          pnpm --filter @omnistay/backend build

