apiVersion: v1
kind: Namespace
metadata:
  name: omnistay-production
---
# Active Live Service Router (Directs traffic to Blue or Green)
apiVersion: v1
kind: Service
metadata:
  name: omnistay-backend-service
  namespace: omnistay-production
  labels:
    app: omnistay-backend
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      name: http-api
  selector:
    app: omnistay-backend
    version: blue # Point to "blue" or "green" during zero-downtime cutover
---
# Blue Deployment (Current Production Active)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnistay-backend-blue
  namespace: omnistay-production
  labels:
    app: omnistay-backend
    version: blue
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0 # Zero downtime front-desk operations guarantee
  selector:
    matchLabels:
      app: omnistay-backend
      version: blue
  template:
    metadata:
      labels:
        app: omnistay-backend
        version: blue
    spec:
      containers:
        - name: backend
          image: ghcr.io/sadman-sakib-12/omnistay-backend:v1.2.0-blue
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: omnistay-production-secrets
            - configMapRef:
                name: omnistay-production-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /api/v1/developer/dod-checklist
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/developer/roadmap
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
---
# Green Deployment (Candidate for Zero-Downtime Verification & Cutover)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnistay-backend-green
  namespace: omnistay-production
  labels:
    app: omnistay-backend
    version: green
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: omnistay-backend
      version: green
  template:
    metadata:
      labels:
        app: omnistay-backend
        version: green
    spec:
      containers:
        - name: backend
          image: ghcr.io/sadman-sakib-12/omnistay-backend:v1.3.0-green
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: omnistay-production-secrets
            - configMapRef:
                name: omnistay-production-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /api/v1/developer/dod-checklist
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/developer/roadmap
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5

